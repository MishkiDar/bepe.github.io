<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перенаправление на вера.рф</title>
    <!-- Мгновенный редирект через meta-тег -->
    <meta http-equiv="refresh" content="0; url=https://вера.рф">
    <!-- Дополнительный редирект через JavaScript (на случай, если meta не сработает) -->
    <script>
        // Мгновенный переход без задержек
        window.location.replace("https://вера.рф");
    </script>
</head>
<body>
    <!-- Контент на случай, если редирект не сработает -->
    <p>Если перенаправление не произошло, <a href="https://вера.рф">нажмите здесь</a>.</p>
</body>
</html>
